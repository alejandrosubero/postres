

    <div class="dash-root">
 
  <div class="dash-header" @fadeIn>
    <div class="dash-header__left">
      <span class="dash-header__greeting">{{ greeting() }}</span>
      <h1 class="dash-header__title">Dashboard</h1>
    </div>
    <div class="dash-header__right">
      <span class="dash-header__total-badge">
        {{ pedidosFiltrados().length }} pedidos
      </span>
    </div>
  </div>

  <div class="dash-period" @fadeIn>
    <button
      *ngFor="let p of periods"
      class="period-pill"
      [class.active]="period() === p.id"
      (click)="period.set(p.id)"
    >{{ p.label }}</button>
  </div>

  <app-dashboard-alertas
    *ngIf="alertas().length > 0"
    [alertas]="alertas()"
    @fadeIn
  />

  <div class="dash-sections" [@sectionsIn]="period()">

    <section class="dash-section">
      <div class="dash-section__header">
        <span class="dash-section__icon">📊</span>
        <h2 class="dash-section__title">Indicadores clave</h2>
        <span class="dash-section__sub">KPIs del período</span>
      </div>
      <app-dashboard-kpis [pedidos]="pedidosFiltrados()" />
    </section>

    <section class="dash-section">
      <div class="dash-section__header">
        <span class="dash-section__icon">💰</span>
        <h2 class="dash-section__title">Análisis financiero</h2>
        <span class="dash-section__sub">Ingresos, costos, logística y gastos operativos</span>
      </div>
      <app-dashboard-financiero 
        [pedidos]="pedidosFiltrados()" 
        [gastosOperativos]="gastosOperativosFiltrados()"
        [period]="period()" />
    </section>

    <section class="dash-section">
      <div class="dash-section__header">
        <span class="dash-section__icon">🍰</span>
        <h2 class="dash-section__title">Top recetas</h2>
        <span class="dash-section__sub">Rentabilidad por receta</span>
      </div>
      <app-dashboard-recetas [pedidos]="pedidosFiltrados()" />
    </section>

    <section class="dash-section">
      <div class="dash-section__header">
        <span class="dash-section__icon">👥</span>
        <h2 class="dash-section__title">Clientes top</h2>
        <span class="dash-section__sub">Ley de Pareto 80/20</span>
      </div>
      <app-dashboard-clientes [pedidos]="pedidosFiltrados()" />
    </section>

  </div>

  <div class="dash-bottom-safe"></div>
</div>
