<div class="dialog-container">

  @if(data.orderNumber){
    
  <h2 mat-dialog-title class="title">Reportar Issue - Pedido #{{data.orderNumber}}</h2>
  }@else {
  <h2 mat-dialog-title class="title">Reportar Issue - Pedido #{{data.name}}</h2>
  }

  <mat-dialog-content [formGroup]="issueForm">
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Porcentaje de Error</mat-label>
        <input matInput type="number" formControlName="porcentajeError" cdkFocusInitial>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Costo del Issue</mat-label>
        <input matInput type="number" formControlName="costOfIssue">
      </mat-form-field>

      <div class="toggle-group">
        <label>¿Afecta Costos?</label>
        <mat-slide-toggle formControlName="issueAffectsCosts"
          [className]="issueForm.get('issueAffectsCosts')?.value ? 'toggle-green' : 'toggle-red'">
        </mat-slide-toggle>
      </div>

      <div class="toggle-group">
        <label>¿Afecta el Precio?</label>
        <mat-slide-toggle formControlName="issueAffectThePrice"
          [className]="issueForm.get('issueAffectThePrice')?.value ? 'toggle-green' : 'toggle-red'">
        </mat-slide-toggle>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Notas del Issue</mat-label>
        <textarea matInput formControlName="issueNote" rows="3"></textarea>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()" class="btn-cancel">CANCELAR</button>
    <button mat-flat-button color="primary" (click)="onSave()" [disabled]="issueForm.invalid">GUARDAR</button>
  </mat-dialog-actions>
</div>
