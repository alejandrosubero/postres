<h2 mat-dialog-title>Añadir stock</h2>
    <mat-dialog-content>
      <p><strong>{{ data.nombre }}</strong> - Cantidad actual: {{ data.cantidad }} {{ data.unidadBase }}</p>
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Cantidad a añadir</mat-label>
        <input matInput type="number" [(ngModel)]="quantityToAdd" min="1" cdkFocusInitial>
      </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>Cancelar</button>
      <button mat-button color="primary" [disabled]="!quantityToAdd || quantityToAdd <= 0" (click)="addStock()">Añadir</button>
    </mat-dialog-actions>
