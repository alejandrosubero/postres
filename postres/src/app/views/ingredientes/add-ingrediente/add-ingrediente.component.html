<div class="container">
  <!-- <h1>Nuevo Ingrediente</h1> -->
  <form [formGroup]="form" (ngSubmit)="guardar()">
    
    <mat-form-field appearance="fill">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
    </mat-form-field>

     <mat-form-field appearance="fill">
      <mat-label>Categoria</mat-label>
      <input matInput formControlName="categoria">
    </mat-form-field>
    
    <div style="display: flex; gap: 10px;">
      <mat-form-field appearance="fill">
        <mat-label>Presentación</mat-label>
        <input matInput type="number" formControlName="presentacion">
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Unidad</mat-label>
        <mat-select formControlName="unidadBase">
          @for (u of unidades; track u) {
            <mat-option [value]="u">{{u}}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="fill">
      <mat-label>Precio</mat-label>
      <input matInput type="number" formControlName="precio">
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Precio por Unidad</mat-label>
      <input matInput [value]="form.get('precioPorUnidad')?.value" readonly>
    </mat-form-field>


  <mat-form-field appearance="fill">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" formControlName="cantidad">
    </mat-form-field>

 <div style="display: flex; gap: 10px;">
      <mat-form-field appearance="fill">
        <mat-label>Cantidad Minima</mat-label>
        <input matInput type="number" formControlName="cantidadMinima">
      </mat-form-field>

      <mat-slide-toggle formControlName="notificar">
       <p style="color: white;">Notificar</p> 
      </mat-slide-toggle>
    </div>


    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Notas</mat-label>
      <textarea matInput formControlName="notas" rows="3" placeholder="Ej: Great Value..."></textarea>
    </mat-form-field>

    <button type="submit" class="btn-save" [disabled]="form.invalid">Guardar Ingrediente</button>
  </form>
</div>
