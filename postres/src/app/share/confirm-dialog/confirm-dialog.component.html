 <h2 mat-dialog-title>¿Eliminar?</h2>
    <mat-dialog-content>
      <p>¿Estás seguro de que deseas eliminar este ingrediente de la lista?</p>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button (click)="dialogRef.close(false)">No</button>
      <button mat-button color="warn" (click)="dialogRef.close(true)">Sí</button>
    </mat-dialog-actions>
